<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雨縫</title>
<meta name="theme-color" content="#0f1622">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f1622;--bg2:#15202f;--card:#1a2535;--line:#2a3850;--txt:#e8eef7;--muted:#9fb0c8;--dim:#5d6e87;
--dry:#3a86ff;--i1:#7aa7ff;--i2:#42c98b;--i3:#f2c14e;--i4:#f2884e;--i5:#e5484d;--sky:#3a86ff;--warn:#f2884e;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:env(safe-area-inset-top) 16px 60px;padding-top:18px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.wm{font-size:14px;font-weight:800;letter-spacing:2px;color:var(--muted)}
.time{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.topr{display:flex;align-items:center;gap:10px}
.cbtn{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:4px 11px;font-size:12px;cursor:pointer;font-weight:600}
.cbtn:active{opacity:.6}
.cverd{font-size:30px;font-weight:800;margin:8px 0 14px}
.crow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.crow b{color:var(--txt);font-size:15px}
.cnote{padding:12px 0;color:var(--i3);font-size:14px}
.cmeta{font-size:11px;color:var(--dim);margin-top:14px}
.cexp{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
.cdl{display:block;text-align:center;margin-top:16px;background:var(--card);border:1px solid var(--line);color:var(--sky);border-radius:10px;padding:10px;font-size:13px;font-weight:600;text-decoration:none}
.clock{font-size:54px;font-weight:800;letter-spacing:1px;margin:6px 0 0;font-variant-numeric:tabular-nums}
.fresh{font-size:12px;color:var(--dim);margin-top:2px}
.fresh.stale{color:var(--i4)}

/* 共用水杯卡 */
.wcard{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px}
.wfill{position:absolute;left:0;right:0;bottom:0;transition:height 1s cubic-bezier(.4,1.2,.5,1),background .5s,opacity .4s;opacity:.42;border-radius:0 0 14px 14px}
  .wfill::before{content:"";position:absolute;top:-5px;left:0;right:0;height:11px;background:inherit;border-radius:50%;opacity:.85}
  .bigcard .wfill{border-radius:0 0 16px 16px}
.wcard .inner{position:relative;z-index:2}

/* 精簡模式大卡 */
.simple{margin-top:18px}
.bigcard{min-height:300px;padding:0}
.bigcard .inner{padding:22px 20px 20px;display:flex;flex-direction:column;height:100%;min-height:300px}
.bigloc{font-size:15px;color:var(--muted)}
.bigsub{font-size:12px;color:var(--dim);margin-top:2px}
.bigverdict{font-size:34px;font-weight:800;margin-top:auto;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.bighint{font-size:15px;color:var(--txt);opacity:.92;margin-top:8px}
.bigup{margin-top:20px;font-size:15px;font-weight:700}
.biglabel{font-size:11px;color:var(--dim);margin:14px 0 6px;font-weight:700}
.bignear{font-size:12px;color:var(--i3);margin-top:6px}
.rib{display:flex;gap:4px;margin-top:10px;align-items:flex-end;height:30px}
.rib .seg{flex:1;border-radius:4px;transition:height .7s,background .5s}
.rhrs{display:flex;gap:4px;margin-top:4px}
.rhrs span{flex:1;text-align:center;font-size:9px;color:var(--dim)}

/* 精簡：提示卡（未定位） */
.askcard{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 22px;text-align:center}
.askcard p{color:var(--muted);font-size:15px;margin:0 0 18px;line-height:1.6}
.btn{background:var(--sky);color:#fff;border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--muted);margin-top:10px}

/* 進階：點卡 */
.points{display:flex;gap:8px;margin-top:18px}
.pp{flex:1;height:118px;cursor:pointer}
.pp .inner{padding:13px 6px;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-start;gap:1px}
.pp .ar{font-size:13px;color:var(--muted)}
.pp .lv{font-size:15px;font-weight:800;margin-top:3px}
.pp .mrib{display:flex;gap:2px;margin-top:9px}
.pp .mrib i{flex:1;height:4px;border-radius:2px}

/* 進階：路徑 tabs + 卡 */
.tabs{display:flex;gap:6px;margin:22px 0 14px}
.tab{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px 4px;text-align:center;cursor:pointer}
.tab .rt{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab .tg{font-size:11px;color:var(--dim);margin-top:2px}
.tab.on{background:var(--card);border-color:var(--sky)}.tab.on .rt{color:var(--txt)}
.tab.on.alert{border-color:var(--i4)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.verdict{font-size:22px;font-weight:800}
.vhint{font-size:14px;color:var(--muted);margin-top:6px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px}
.route{font-size:14px;color:var(--muted)}.raq{color:var(--dim);margin:0 6px}
.state{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.sd{width:8px;height:8px;border-radius:50%}
.daylabel{font-size:11px;color:var(--dim);margin:16px 0 6px;font-weight:700}
.day{position:relative;height:26px;margin-top:4px}
.dtrack{position:absolute;inset:0;background:var(--bg2);border-radius:7px}
.dblock{position:absolute;top:0;bottom:0;border-radius:5px;opacity:.85}
.dnow{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--txt)}
.dticks{position:absolute;top:28px;left:0;right:0;display:flex;justify-content:space-between;font-size:9px;color:var(--dim)}
.day.lbl{margin-bottom:18px}

/* mode bar / footer */
.modebar{margin-top:24px;text-align:center}
.modebar button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:9px 18px;font-size:13px;cursor:pointer}
footer{margin-top:18px;font-size:11px;color:var(--dim);line-height:1.7;text-align:center}
.brand{font-weight:700;color:var(--muted);letter-spacing:1px}

/* detail overlay */
.detail{position:fixed;inset:0;background:rgba(8,12,20,.72);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.detail[hidden]{display:none}
.dpanel{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:18px 16px 30px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.dttl{font-size:20px;font-weight:800}.dsub{font-size:12px;color:var(--dim);margin-top:3px}
.dclose{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:9px;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none}
.dlabel{font-size:12px;color:var(--dim);margin:18px 0 8px;font-weight:700}
.dlist{display:flex;flex-direction:column;gap:7px}
.drow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.drow .dot{width:9px;height:9px;border-radius:50%;flex:none}
.dname{flex:1;font-size:14px;font-weight:600}.ddist{font-size:11px;color:var(--dim);margin-left:7px;font-weight:400}
.dlv{font-size:13px;font-weight:700;white-space:nowrap}
.dnote{font-size:11px;color:var(--dim);margin-top:16px;line-height:1.5}
.dloading{padding:34px 0;text-align:center;color:var(--muted)}
.dempty{color:var(--dim);font-size:13px;padding:8px}
  .bigsub2{font-size:11px;color:var(--dim);margin-top:2px}
  .poss{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:12px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);width:fit-content}
  .poss .d{width:7px;height:7px;border-radius:50%}
  .warnline{font-size:12px;color:var(--warn);margin-top:10px;font-weight:600}
  .ev3{display:flex;align-items:flex-end;gap:6px;height:44px;margin-top:8px}
  .ev3 .b{flex:1;border-radius:4px;min-height:5px;transition:height .6s,background .5s}
  .evax{display:flex;justify-content:space-between;font-size:9px;color:var(--dim);margin-top:4px}
  .whytog{font-size:12px;color:var(--sky);margin-top:16px;font-weight:600;cursor:pointer;user-select:none}
  .whybox{margin-top:8px;display:none;flex-wrap:wrap;gap:5px}
  .whybox.show{display:flex}
  .chip{font-size:10px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
  .chip.w{color:var(--warn);border-color:var(--warn)}
  .warnbar{background:rgba(242,136,78,.12);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="wm">雨縫</span><span class="topr"><button class="cbtn" onclick="openConf()">準度</button><span class="time" id="now2">—</span></span></div>
  <div class="clock" id="clock">—</div>
  <div class="fresh" id="fresh">載入中…</div>
  <div id="warnbar"></div>

  <div class="simple" id="simpleView"></div>
  <div id="proView" hidden>
    <div class="points" id="points"></div>
    <div class="tabs" id="tabs"></div>
    <div id="card"></div>
  </div>

  <div class="modebar" id="modebar"></div>
  <footer>
    <div class="brand">雨縫 · 見隙而行</div>
    中央氣象署 雨量站 / 鄉鎮預報 · 強度 mm/hr 分級 · 僅供參考
    <div id="ferr"></div>
  </footer>
</div>
<div id="detail" class="detail" hidden onclick="if(event.target===this)closeDetail()"></div>
<div id="conf" class="detail" hidden onclick="if(event.target===this)closeConf()"></div>

<script>
const DATA_URL="/data.json";
function nowStr(){return new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});}
function nowHr(){const d=new Date();return d.getHours()+d.getMinutes()/60;}
const TIERC=["var(--dry)","var(--i1)","var(--i2)","var(--i3)","var(--i4)","var(--i5)"];
const WORD=["雨","毛毛雨","小雨","中雨","大雨","豪雨"];

function classify(mm){
  if(mm==null||mm<=0) return {t:0,label:"無雨",c:"var(--dim)"};
  if(mm<1)  return {t:1,label:"毛毛雨",c:"var(--i1)"};
  if(mm<4)  return {t:2,label:"小雨",c:"var(--i2)"};
  if(mm<10) return {t:3,label:"中雨",c:"var(--i3)"};
  if(mm<30) return {t:4,label:"大雨",c:"var(--i4)"};
  return {t:5,label:"豪雨",c:"var(--i5)"};
}
// 白話判語（現在）
function verdict(mm){
  const t=classify(mm).t;
  if(t===0) return {title:"目前無雨",hint:"現在可以放心出門"};
  if(t===1) return {title:"飄著毛毛雨",hint:"影響不大，免帶傘也行"};
  if(t===2) return {title:"正在下小雨",hint:"帶把傘比較保險"};
  if(t===3) return {title:"正在下中雨",hint:"記得帶傘再出門"};
  if(t===4) return {title:"正在下大雨",hint:"建議等 10–15 分再走"};
  return {title:"正在下豪雨",hint:"先別出門，改搭捷運"};
}
// 白話：稍後預報
function upcoming(blocks){
  const fut=(blocks||[]).filter(b=>b.to>nowHr());
  if(!fut.length) return "今天接下來看起來都乾";
  const b=fut[0], k=classify(b.mm_hr);
  if(b.from<=nowHr()) return `${b.to} 時前還有${k.label}`;
  return `${b.from} 時後可能有${k.label}`;
}
// 未來幾個 3 小時時段顏色（從現在起）
function slots(blocks,dayWin){
  const w1=(dayWin&&dayWin[1])||24, out=[], start=Math.floor(nowHr()/3)*3;
  for(let h=start; h<Math.min(w1,start+15) && out.length<5; h+=3){
    const b=(blocks||[]).find(x=>x.from<=h && x.to>h);
    out.push({h, k:b?classify(b.mm_hr):classify(0)});
  }
  return out;
}
function fillH(mm){ return mm<=0?0:Math.min(92,12+mm/30*80); }

// 進階路徑卡狀態：白話
const STATE_TXT={confirmed:{t:"正在下",c:"var(--i4)"},forming:{t:"快下了",c:"var(--i3)"},
  forecast:{t:"稍後可能下",c:"var(--dim)"},cleared:{t:"今天看起來乾",c:"var(--dry)"},revised:{t:"雨勢有變",c:"var(--i3)"}};

let DATA=null, HERE=null, sel=0;
let MODE=(function(){try{return localStorage.getItem("rw_mode")||"simple"}catch(e){return "simple"}})();
function saveMode(m){try{localStorage.setItem("rw_mode",m)}catch(e){}}

/* ---------------- 精簡模式 ---------------- */
function renderSimple(){
  const v=document.getElementById("simpleView");
  if(!HERE||!HERE.here){
    v.innerHTML=`<div class="askcard"><p>開啟定位，看你「所在地」現在與稍後的雨況。</p>
      <button class="btn" onclick="initGeo(true)">開啟定位</button>
      <button class="btn ghost" onclick="setMode('pro')">改用進階模式（看固定地點）</button></div>`;
    return;
  }
  const h=HERE.here, nc=h.nowcast||{};
  const tier=(nc.tier!=null)?nc.tier:classify(h.mm_hr).t;
  const tc=TIERC[tier]||"var(--txt)";
  const ev=nc.evidence||[h.mm_hr||0,h.qpf_1h||0,0];
  const evbars=ev.map(mm=>{const k=classify(mm);const ht=mm<=0?6:Math.min(100,14+mm/16*86);
    return `<div class="b" style="height:${ht}%;background:${mm<=0?'var(--line)':k.c}"></div>`}).join("");
  const why=(nc.why||[]).map(w=>`<span class="chip${/特報/.test(w)?' w':''}">${w}</span>`).join("");
  const warnLine=nc.warn?`<div class="warnline">⚠ ${h.county||""}${nc.warn}特報（全區）</div>`:"";
  const poss=nc.possibility||"", possC=poss==="高"?"var(--i2)":poss==="中"?"var(--i3)":"var(--dry)";
  const fillNow=h.mm_hr<=0?0:Math.min(40,14+h.mm_hr/30*26);
  v.innerHTML=`<div class="wcard bigcard">
    <div class="wfill" style="height:${fillNow}%;background:${classify(h.mm_hr).c}${h.mm_hr<=0?';opacity:0':''}"></div>
    <div class="inner">
      <div class="bigloc">所在地 · ${h.county||""}<div class="bigsub2">最近測站 ${h.name||""}</div></div>
      <div class="bigverdict" style="color:${tc};margin-top:auto">${nc.verdict||"—"}</div>
      <div class="bighint">${nc.sub||""}</div>
      <span class="poss" style="color:${possC}"><span class="d" style="background:${possC}"></span>可能性 ${poss}</span>
      ${warnLine}
      <div class="evlabel" style="margin-top:18px">接下來的雨勢</div>
      <div class="ev3">${evbars}</div>
      <div class="evax"><span>現在</span><span>+1 小時</span><span>+3 小時</span></div>
      <div class="whytog" onclick="this.nextElementSibling.classList.toggle('show')">▸ 為什麼這樣判？</div>
      <div class="whybox">${why}</div>
    </div></div>`;
}

/* ---------------- 進階模式 ---------------- */
function ppCard(label,p,onclick){
  const mm=p.mm_hr||0, nc=p.nowcast||{};
  const tier=(nc.tier!=null)?nc.tier:classify(mm).t;
  const tc=TIERC[tier]||"var(--muted)";
  const h=mm<=0?0:Math.min(50,16+mm/30*34);
  const segs=slots(p.plan,DATA.day_window).map(s=>`<i style="background:${s.k.t?s.k.c:'var(--line)'}"></i>`).join("");
  // label 一律以 fusion tier 為準（跟精簡卡/路徑卡同調）
  const nowT=classify(mm).t;
  let lv;
  if(tier<=0) lv="無雨";
  else if(nowT>=tier) lv=WORD[tier];          // 當下已達該強度：直接講強度詞
  else lv="轉"+WORD[tier];                     // 當下較弱、等下更強：轉{詞}
  return `<div class="pp wcard" onclick="${onclick}">
    <div class="wfill" style="height:${h}%;background:${classify(mm).c}${mm<=0?';opacity:0':''}"></div>
    <div class="inner"><div class="ar">${label}</div>
      <div class="lv" style="color:${tier>0?tc:'var(--muted)'}">${lv}</div>
      <div class="mrib">${segs}</div></div></div>`;
}
function renderPoints(){
  let html="";
  if(HERE&&HERE.here) html+=ppCard("所在地",{mm_hr:HERE.here.mm_hr,plan:HERE.plan,nowcast:HERE.here.nowcast},`openDetailLL(${HERE.lat},${HERE.lng},'所在地')`);
  html+=(DATA.points||[]).map(p=>ppCard(p.area,p,`openPoint('${p.id}')`)).join("");
  document.getElementById("points").innerHTML=html;
}
function renderTabs(){
  const area={}; (DATA.points||[]).forEach(pt=>area[pt.id]=pt.area);
  document.getElementById("tabs").innerHTML=(DATA.paths||[]).map((p,i)=>{
    const alert=p.status!=="clear";
    return `<div class="tab ${i===sel?'on':''} ${alert?'alert':''}" onclick="pick(${i})">
      <div class="rt">${area[p.from]||p.from}→${area[p.to]||p.to}</div><div class="tg">${p.tag||''}</div></div>`;
  }).join("");
}
function dayStrip(plan,dayWin){
  const w0=(dayWin&&dayWin[0])??6, w1=(dayWin&&dayWin[1])??24, span=(w1-w0)||1;
  const pos=h=>Math.max(0,Math.min(100,(h-w0)/span*100));
  let blocks=""; ((plan&&plan.blocks)||[]).forEach(b=>{const ck=classify(b.mm_hr),l=pos(b.from),w=Math.max(2.5,pos(b.to)-pos(b.from));
    blocks+=`<div class="dblock" style="left:${l}%;width:${w}%;background:${ck.c}" title="${b.from}-${b.to}時 ${ck.label}${b.pop?' '+b.pop+'%':''}"></div>`;});
  let ticks=""; for(let h=w0;h<=w1;h+=3) ticks+=`<span>${String(h%24).padStart(2,'0')}</span>`;
  const L=pos(nowHr());
  return `<div class="day lbl"><div class="dtrack"></div>${blocks}<div class="dnow" style="left:${L}%"></div><div class="dticks">${ticks}</div></div>`;
}
function renderCard(){
  const p=DATA.paths[sel];
  const area={}; (DATA.points||[]).forEach(pt=>area[pt.id]=pt.area);
  const pf=(DATA.points||[]).find(x=>x.id===p.from)||{}, pt2=(DATA.points||[]).find(x=>x.id===p.to)||{};
  let top=null; [pf.nowcast,pt2.nowcast].forEach(n=>{ if(n&&(!top||(n.tier||0)>(top.tier||0))) top=n; });
  let vtxt,vhint,vc;
  if(!top||top.tier===0){ vtxt="整段無雨"; vhint="這條路徑現在與接下來都沒有雨"; vc="var(--dry)"; }
  else {
    const word=WORD[top.tier]||"雨", raining=Math.max(pf.mm_hr||0,pt2.mm_hr||0)>=0.2;
    vtxt = raining?`出發就遇${word}`:`出發後不久遇${word}`;
    vhint=top.sub||"帶傘"; vc=TIERC[top.tier];
  }
  const st=STATE_TXT[(p.plan&&p.plan.state)]||STATE_TXT.forecast;
  const warnB=top&&top.warn?`<div class="warnline" style="margin:10px 0 0">⚠ ${top.warn}特報（全區）</div>`:"";
  document.getElementById("card").innerHTML=
    `<div class="card">
      <div class="verdict" style="color:${vc}">${vtxt}</div>
      <div class="vhint">${vhint}</div>
      ${warnB}
      <div class="meta"><span class="route">${area[p.from]||p.from}<span class="raq">→</span>${area[p.to]||p.to}</span>
        <span class="state"><span class="sd" style="background:${st.c}"></span><span style="color:${st.c}">${st.t}</span></span></div>
      <div class="daylabel">今日預報（每 3 小時 · 縣市級）</div>
      ${dayStrip(p.plan,DATA.day_window)}
    </div>`;
}
function pick(i){ sel=i; renderTabs(); renderCard(); }

/* ---------------- detail 浮層 ---------------- */
function openPoint(id){ const p=(DATA.points||[]).find(x=>x.id===id); if(p) openDetailLL(p.lat,p.lng,p.area); }
async function openDetailLL(lat,lng,label){
  const el=document.getElementById("detail");
  el.innerHTML=`<div class="dpanel"><div class="dhead"><div class="dttl">${label}</div><button class="dclose" onclick="closeDetail()">✕</button></div><div class="dloading">載入中…</div></div>`;
  el.hidden=false;
  try{
    const at=await (await fetch(`/at?lat=${lat}&lng=${lng}&n=8`,{cache:"no-store"})).json();
    if(at.error) throw at.error;
    renderDetail(label,at);
  }catch(e){ el.innerHTML=`<div class="dpanel"><div class="dhead"><div class="dttl">${label}</div><button class="dclose" onclick="closeDetail()">✕</button></div><div class="dloading">讀取失敗：${e}</div></div>`; }
}
function renderDetail(label,at){
  const cty=at.here&&at.here.county?at.here.county:"本區";
  const ss=slots(at.plan,at.day_window);
  const segs=ss.map(s=>`<div class="seg" style="height:${s.k.t?Math.max(20,fillH(s.k.t*5)):8}%;background:${s.k.t?s.k.c:'var(--line)'}"></div>`).join("");
  const hrs=ss.map(s=>`<span>${String(s.h%24).padStart(2,'0')}</span>`).join("");
  const rows=(at.nearby||[]).map(s=>{const k=classify(s.mm_hr);
    return `<div class="drow"><span class="dot" style="background:${k.t?k.c:'var(--dim)'}"></span>
      <div class="dname">${s.name}<span class="ddist">${s.dist_km}km</span></div>
      <div class="dlv" style="color:${k.c}">${k.label}${s.mm_hr>0?` · ${s.mm_hr}`:''}</div></div>`;}).join("");
  document.getElementById("detail").innerHTML=
    `<div class="dpanel">
      <div class="dhead"><div><div class="dttl">${label}</div><div class="dsub">${cty}${at.here?' · 最近站 '+at.here.name:''}</div></div>
        <button class="dclose" onclick="closeDetail()">✕</button></div>
      ${(function(){const nc=at.here&&at.here.nowcast;if(!nc)return"";const c=TIERC[nc.tier]||"var(--txt)";const wl=nc.warn?`<div class="warnline" style="margin-top:8px">⚠ ${cty}${nc.warn}特報（全區）</div>`:"";return `<div style="font-size:21px;font-weight:800;color:${c};margin-top:4px">${nc.verdict}</div><div style="font-size:13px;color:var(--muted);margin-top:4px">${nc.sub||""}</div>${wl}`;})()}
      <div class="dlabel">今日預報（${cty}逐 3 小時）</div>
      <div class="rib">${segs}</div><div class="rhrs">${hrs}</div>
      <div class="dlabel">附近測站現況（mm/hr）</div>
      <div class="dlist">${rows||'<div class="dempty">附近無測站資料</div>'}</div>
      <div class="dnote">預報為縣市級，同縣市共用；現況為各站實測，逐站不同。</div>
    </div>`;
  document.getElementById("detail").hidden=false;
}
function closeDetail(){ document.getElementById("detail").hidden=true; }
function closeConf(){ document.getElementById("conf").hidden=true; }
async function openConf(){
  const el=document.getElementById("conf"); el.hidden=false;
  const head=`<div class="dhead"><div><div class="dttl">判斷準度</div><div class="dsub">最近一週 · 與雨量站對答案</div></div><button class="dclose" onclick="closeConf()">✕</button></div>`;
  el.innerHTML=`<div class="dpanel">${head}<div class="dloading">載入中…</div></div>`;
  try{
    const d=await (await fetch("/shadow/latest")).json();
    const p=d.public||{}, cov=d.coverage||{}, n=p.settled||0, enough=n>=20;
    const vc=p.verdict==="大致可靠"?"var(--i2)":p.verdict==="普通"?"var(--i3)":p.verdict==="偏弱"?"var(--i4)":"var(--dim)";
    let body;
    if(!d.week){ body=`<div class="cnote">尚無資料，仍在累積中。</div>`; }
    else {
      body=`<div class="cverd" style="color:${vc}">${p.verdict||"—"}</div>`;
      if(enough){
        body+=`<div class="crow"><span>判斷方向命中</span><b>${p.hit_phrase}</b></div>`;
        body+=`<div class="crow"><span>漏報（沒提醒卻下了）</span><b>${p.miss_phrase}</b></div>`;
      } else {
        body+=`<div class="cnote">${p.note||"資料累積中，暫不評分。"}</div>`;
      }
      body+=`<div class="cmeta">${d.week} · 已對答案 ${n} 筆</div>`;
      body+=`<div class="cexp">準度＝把過去的判斷，跟雨量站實際下的雨對答案算出來的。爛週也照實顯示，不修飾。</div>`;
      body+=`<a class="cdl" href="/shadow/file?week=${d.week}">下載本週週報</a>`;
    }
    el.querySelector(".dpanel").innerHTML=head+body;
  }catch(e){
    el.querySelector(".dpanel").innerHTML=head+`<div class="dloading">讀取失敗</div>`;
  }
}

/* ---------------- geolocation ---------------- */
function initGeo(force){
  if(!navigator.geolocation){ if(force) alert("此裝置不支援定位"); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude, lng=pos.coords.longitude;
    try{
      const at=await (await fetch(`/at?lat=${lat}&lng=${lng}&n=8`,{cache:"no-store"})).json();
      if(at&&!at.error){ HERE={lat,lng,here:at.here,plan:at.plan,nearby:at.nearby,day_window:at.day_window,qpf_time:at.qpf_time}; renderActive(); }
    }catch(e){}
  },()=>{ if(force) alert("無法取得定位，請檢查權限"); renderActive(); },{timeout:8000,maximumAge:300000});
}

/* ---------------- mode ---------------- */
function setMode(m){ MODE=m; saveMode(m); renderActive(); }
function updateWarnbar(){
  const ws=new Set();
  [HERE&&HERE.here&&HERE.here.nowcast].concat((DATA&&DATA.points||[]).map(p=>p.nowcast)).forEach(n=>{if(n&&n.warn)ws.add(n.warn);});
  const wb=document.getElementById("warnbar");
  if(wb) wb.innerHTML = ws.size?`<div class="warnbar">⚠ ${[...ws].join("、")}特報生效中</div>`:"";
}
function renderActive(){
  updateWarnbar();
  const simple=MODE==="simple";
  document.getElementById("simpleView").hidden=!simple;
  document.getElementById("proView").hidden=simple;
  document.getElementById("modebar").innerHTML= simple
    ? `<button onclick="setMode('pro')">進階模式：多地點 / 通勤路徑 →</button>`
    : `<button onclick="setMode('simple')">← 回精簡模式</button>`;
  if(simple){ renderSimple(); }
  else if(DATA){
    const h=new Date().getHours(); const want=(h>=5&&h<12)?"上班":"下班";
    const idx=(DATA.paths||[]).findIndex(p=>p.tag===want); sel=idx>=0?idx:0;
    renderPoints(); renderTabs(); renderCard();
  }
}
function render(d){
  DATA=d;
  document.getElementById("clock").textContent=nowStr();
  document.getElementById("now2").textContent="現在";
  const age=d.source_age_min, f=document.getElementById("fresh");
  const dt=(d.updated_local||"").split(" ")[1]||"";
  f.textContent=`資料 ${dt} 更新 · ${age} 分前`; f.className="fresh"+(age>=10?" stale":"");
  renderActive();
}

(async function(){
  try{ const r=await fetch(DATA_URL,{cache:"no-store"}); if(!r.ok) throw 0; render(await r.json()); }
  catch(e){ render(MOCK); document.getElementById("ferr").innerHTML=`（示範資料：找不到 data.json）`; }
  initGeo(false);
})();

if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
