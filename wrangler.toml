name = "rainwalker"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 靜態 UI（index.html 等）
[assets]
directory = "./public"
binding = "ASSETS"

# 每 10 分鐘抓一次
[triggers]
crons = ["*/10 * * * *"]

# R2：存算好的 data.json
# ⚠️ bucket_name 必須等於你在 R2 後台建的 bucket 名稱（沒有就建一個叫 rainwalker）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "rainwalker"

# 2026-07-06 已升級 Workers Paid（$5/月，CPU 上限 30s）：免費 10ms 軟性執法曾造成 cron 全滅（見 HANDOFF 事件記錄）
# cron CPU 瘦身（來源共用、QPF 定向掃描、預報快取）仍保留——是好習慣，不因付費而回退

# Workers Logs：invocation 層級記錄，除錯 cron/fetch 用（付費方案含 20M events/月）
[observability]
enabled = true
